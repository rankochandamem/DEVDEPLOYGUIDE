<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Render web service setup</title>
  <desc id="desc">A Render dashboard style setup screen showing a new web service connected to GitHub.</desc>
  <rect width="1200" height="800" fill="#101827"/>
  <rect width="1200" height="72" fill="#172235"/>
  <text x="42" y="45" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">render</text>
  <rect x="1010" y="20" width="135" height="32" rx="6" fill="#27364c" stroke="#52647d"/>
  <text x="1033" y="41" fill="#dbeafe" font-family="Arial, sans-serif" font-size="14">Dashboard</text>
  <rect x="90" y="120" width="1020" height="590" rx="12" fill="#172235" stroke="#33445e"/>
  <text x="140" y="177" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">New Web Service</text>
  <text x="140" y="212" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Deploy an application from a Git repository.</text>
  <rect x="140" y="255" width="920" height="92" rx="8" fill="#0f172a" stroke="#475569"/>
  <circle cx="181" cy="301" r="22" fill="#24292f"/>
  <text x="173" y="309" fill="#fff" font-family="Arial, sans-serif" font-size="23">●</text>
  <text x="225" y="291" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" font-weight="700">GitHub repository</text>
  <text x="225" y="317" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Connect a repository from your GitHub account</text>
  <rect x="140" y="382" width="920" height="66" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="165" y="410" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Repository</text>
  <text x="165" y="433" fill="#f8fafc" font-family="monospace" font-size="16">your-username / your-project</text>
  <rect x="140" y="478" width="440" height="66" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="165" y="506" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Branch</text>
  <text x="165" y="529" fill="#f8fafc" font-family="monospace" font-size="16">main</text>
  <rect x="620" y="478" width="440" height="66" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="645" y="506" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Service name</text>
  <text x="645" y="529" fill="#f8fafc" font-family="monospace" font-size="16">my-web-service</text>
  <rect x="890" y="610" width="170" height="45" rx="7" fill="#00a67e"/>
  <text x="925" y="638" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Create Web Service</text>
</svg>
